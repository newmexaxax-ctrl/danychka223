<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title></title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:default;
    font-family:Arial,Helvetica,sans-serif;color:#ddd;-webkit-user-select:none;user-select:none}

  /* bait: heavy thumbnail-style headline next to a plain button */
  #go{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;
    padding:4vmin}
  .row{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vmin,54px);
    flex-wrap:wrap}

  .hype{display:grid;justify-items:center;line-height:.84;text-transform:uppercase;
    font-family:Impact,Haettenschweiler,"Arial Black","Franklin Gothic Heavy",sans-serif;
    font-weight:900;text-align:center}
  .hype .l1{font-size:clamp(30px,8.5vmin,104px);color:#fff;
    -webkit-text-stroke:2px #000;text-shadow:0 6px 0 rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.8)}
  .hype .l2{font-size:clamp(38px,11vmin,138px);color:#e01b1b;
    -webkit-text-stroke:2px #000;text-shadow:0 6px 0 rgba(0,0,0,.9),0 0 34px rgba(224,27,27,.5)}
  .hype .l3{margin-top:10px;font:11px Arial,Helvetica,sans-serif;letter-spacing:.22em;
    text-transform:none;color:rgba(255,255,255,.35)}

  .play{position:relative;width:clamp(54px,11vmin,96px);aspect-ratio:1;flex:none;
    border-radius:50%;background:#111;border:2px solid #e01b1b;
    box-shadow:0 0 30px -6px rgba(224,27,27,.6)}
  .play::after{content:"";position:absolute;top:50%;left:54%;width:0;height:0;
    transform:translate(-50%,-50%);
    border-left:clamp(14px,3vmin,28px) solid #fff;
    border-top:clamp(10px,2.1vmin,20px) solid transparent;
    border-bottom:clamp(10px,2.1vmin,20px) solid transparent}

  #go button{
    font:700 15px Arial,Helvetica,sans-serif;letter-spacing:.18em;text-transform:uppercase;
    color:#000;background:#fff;border:0;border-radius:16px;
    padding:clamp(40px,9vmin,96px) 36px;cursor:pointer;
    box-shadow:0 14px 34px -16px #000;
    transition:transform .13s ease,box-shadow .13s ease}
  #go button:hover{transform:translateY(-2px);
    box-shadow:0 0 30px -6px rgba(224,27,27,.6),0 18px 40px -16px #000}
  #go button:active{transform:translateY(0) scale(.99)}
  #go button:focus-visible{outline:2px solid #e01b1b;outline-offset:4px}

  /* horror stage: hidden until the click */
  #stage{position:fixed;inset:0;display:none;place-items:center;
    background:radial-gradient(ellipse at 50% 45%,#1a0505 0%,#000 70%)}
  #face{width:min(88vmin,900px);animation:breathe 2.7s ease-in-out infinite}
  #face,#faceSvg{object-fit:contain}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  #cap{position:fixed;left:0;right:0;bottom:6vh;text-align:center;
    font:clamp(18px,3.4vmin,40px)/1 Georgia,serif;letter-spacing:.35em;
    text-transform:uppercase;opacity:.85;text-shadow:0 0 18px #b00}
  #vig{position:fixed;inset:0;pointer-events:none;display:none;z-index:5;
    box-shadow:inset 0 0 22vmin 8vmin #000;opacity:.85}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;
    display:none;z-index:8;mix-blend-mode:screen}
</style>
</head>
<body>

<div id="go">
  <div class="row">
    <div class="play"></div>
    <div class="hype">
      <span class="l1">тут видео</span>
      <span class="l2">с литвином</span>
      <span class="l3">без цензуры · 18+</span>
    </div>
    <button type="button">смотреть</button>
  </div>
</div>

<div id="stage">
  <img id="face" src="STRASHNA.jpg?v=1" alt=""
       onerror="this.remove();document.getElementById('faceSvg').style.display='block'">
  <svg id="faceSvg" viewBox="0 0 400 480" style="display:none">
    <path d="M40 250 C20 90 90 10 200 10 C310 10 380 90 360 250
             L330 190 C300 120 250 90 200 90 C150 90 100 120 70 190 Z" fill="#0b0b0b"/>
    <ellipse cx="200" cy="250" rx="150" ry="190" fill="#cfc4b4"/>
    <ellipse cx="200" cy="250" rx="150" ry="190" fill="none" stroke="#5a5145" stroke-width="3"/>
    <ellipse cx="130" cy="215" rx="52" ry="60" fill="#070707"/>
    <ellipse cx="270" cy="215" rx="52" ry="60" fill="#070707"/>
    <circle cx="138" cy="222" r="7" fill="#fff"/>
    <circle cx="278" cy="222" r="7" fill="#fff"/>
    <path d="M200 235 C186 285 214 285 200 300" stroke="#6b6153" stroke-width="6" fill="none"/>
    <path d="M105 345 L135 330 L165 358 L200 325 L235 358 L265 330 L295 345
             L295 400 L105 400 Z" fill="#0a0a0a"/>
    <path d="M105 345 L135 330 L165 358 L200 325 L235 358 L265 330 L295 345"
          stroke="#e8e0d0" stroke-width="4" fill="none"/>
    <ellipse cx="130" cy="265" rx="46" ry="26" fill="#000" opacity=".25"/>
    <ellipse cx="270" cy="265" rx="46" ry="26" fill="#000" opacity=".25"/>
  </svg>
  <div id="cap">не уходи</div>
</div>
<div id="vig"></div>
<div id="flash"></div>

<script>
const cap   = document.getElementById('cap');
const face  = document.getElementById('face');
const flash = document.getElementById('flash');
const LINES = ['не уходи','ты один','смотри в глаза','я тут','не выключай'];
let i = 0, ac, master, live = false;

// context must be CREATED inside the click handler: a context built on load is
// born "suspended" in every modern browser and resume() is not guaranteed to fire
function scream(){
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain();
  master.gain.value = 0.9;
  master.connect(ac.destination);
  if (ac.state === 'suspended') ac.resume();
  const t = ac.currentTime, dur = 6;

  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let n = 0; n < d.length; n++) d[n] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;

  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 5;
  bp.frequency.setValueAtTime(500, t);
  bp.frequency.exponentialRampToValueAtTime(3000, t + 0.3);
  bp.frequency.exponentialRampToValueAtTime(420, t + dur);

  const shaper = ac.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let n = 0; n < 1024; n++){ const x = n / 512 - 1; curve[n] = Math.tanh(3 * x); }
  shaper.curve = curve;

  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.85, t + 0.06);
  g.gain.setValueAtTime(0.85, t + dur - 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  src.connect(bp); bp.connect(shaper); shaper.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur);

  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.type = o2.type = 'sawtooth'; o1.frequency.value = 46; o2.frequency.value = 49.5;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140;
  const rg = ac.createGain();
  rg.gain.setValueAtTime(0.0001, t);
  rg.gain.exponentialRampToValueAtTime(0.55, t + 0.3);
  rg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.connect(lp); o2.connect(lp); lp.connect(rg); rg.connect(master);
  o1.start(t); o2.start(t); o1.stop(t + dur); o2.stop(t + dur);
}

function reveal(){
  document.getElementById('go').remove();
  document.getElementById('stage').style.display = 'grid';
  document.getElementById('vig').style.display   = 'block';
  document.getElementById('flash').style.display = 'block';
  document.body.style.cursor = 'none';
  scream();
  if (navigator.vibrate) navigator.vibrate([300, 80, 300, 80, 600]);
  if (document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(() => {});
  live = true;
}

let last = 0;
(function loop(ts){
  requestAnimationFrame(loop);
  if (!live) return;
  if (ts - last > 1800){ last = ts; cap.textContent = LINES[i++ % LINES.length]; }
  face.style.transform =
    `translate(${(Math.random()*14-7)|0}px,${(Math.random()*10-5)|0}px) rotate(${(Math.random()*3-1.5)|0}deg)`;
})(0);

function strobe(){
  if (!live) return;
  if (Math.random() < 0.5){
    flash.style.transition = 'none'; flash.style.opacity = 0.85;
    setTimeout(() => { flash.style.transition = 'opacity .12s'; flash.style.opacity = 0; }, 60);
  }
  setTimeout(strobe, 120 + Math.random() * 180);
}

document.querySelector('#go button').addEventListener('click', () => { reveal(); strobe(); });
</script>
</body>
</html>
